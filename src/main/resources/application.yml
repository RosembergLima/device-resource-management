spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/device_management
    username: postgres
    password: postgres
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
    enabled: true

swagger:
  url: http://localhost:8080
  title: Device Resources API
  description: Device Resources API Documentation
  version: 1.0.0