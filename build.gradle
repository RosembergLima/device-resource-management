plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'                               // para gerar relatório de cobertura
    id 'org.sonarqube' version '7.2.2.6593'   // versão mais recente em 2026 (confira em plugins.gradle.org se houver update)
}

group = 'device-resources-management'
version = '0.0.1-SNAPSHOT'
description = 'device-resources-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.postgresql:postgresql:42.7.7'
    implementation 'org.flywaydb:flyway-database-postgresql:11.14.1'  // ou remova se usar o starter completo

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Opcional: Testcontainers para testes de integração com Postgres real
    testImplementation 'org.testcontainers:postgresql:1.20.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.3'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Configuração JaCoCo (obrigatório para Sonar ler cobertura)
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true     // Sonar lê esse arquivo automaticamente
        html.required = true    // para visualização local (opcional)
    }
}

// Configuração SonarQube (pode ser sobrescrita via linha de comando)
sonar {
    properties {
        property 'sonar.projectKey', 'devices-api-challenge'
        property 'sonar.projectName', 'Devices API Challenge'
        property 'sonar.projectVersion', project.version
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.java.source', '21'
        // Exclusões comuns (ajuste conforme necessário)
        property 'sonar.exclusions', '**/*Test.java, **/target/**, **/build/**, **/generated/**'
        // Para rodar localmente sem token (opcional, mas recomendado)
        property 'sonar.host.url', 'http://localhost:9000'
    }
}

// Garante que sonarqube rode após os testes e relatório de cobertura
tasks.named('sonarqube') {
    dependsOn jacocoTestReport
}