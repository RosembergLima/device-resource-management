services:

  postgres:
    container_name: device_db
    image: postgres:14.4
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=device_management
    ports:
      - "5432:5432"
    volumes:
      - device-postgresql-vol:/var/lib/postgresql/data

volumes:
  device-postgresql-vol: